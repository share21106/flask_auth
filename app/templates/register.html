{% extends 'base.html' %} {% block title %}Register — Flask Mongo Auth{%
endblock %} {% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="bg-white rounded-lg shadow px-6 py-8">
    <h2 class="text-2xl font-bold text-slate-800">Create an account</h2>
    <p class="mt-2 text-sm text-slate-500">
      Register with a username and strong password.
    </p>

    <form method="post" class="mt-6 space-y-4" novalidate>
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Username</span>
        <input
          name="username"
          required
          class="mt-1 block w-full rounded-md border-slate-200 bg-slate-50 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300"
        />
      </label>

      <label class="block">
        <span class="text-sm font-medium text-slate-700">Password</span>
        <input
          name="password"
          type="password"
          required
          class="mt-1 block w-full rounded-md border-slate-200 bg-slate-50 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300"
        />
      </label>

      <label class="block">
        <span class="text-sm font-medium text-slate-700">Confirm password</span>
        <input
          name="confirm_password"
          type="password"
          required
          class="mt-1 block w-full rounded-md border-slate-200 bg-slate-50 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300"
        />
      </label>

      <div>
        <button
          type="submit"
          class="w-full inline-flex justify-center items-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700"
        >
          Create account
        </button>
      </div>
    </form>

    <p class="mt-4 text-center text-sm text-slate-500">
      Already have an account?
      <a
        href="{{ url_for('auth.login') }}"
        class="text-indigo-600 hover:underline"
        >Log in</a
      >
    </p>
  </div>
</div>
{% endblock %}
