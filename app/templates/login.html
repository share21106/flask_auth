{% extends 'base.html' %} {% block title %}Login — Flask Mongo Auth{% endblock
%} {% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="bg-white rounded-lg shadow px-6 py-8">
    <h2 class="text-2xl font-bold text-slate-800">Sign in to your account</h2>
    <p class="mt-2 text-sm text-slate-500">
      Enter your username and password to continue.
    </p>

    <form method="post" class="mt-6 space-y-4" novalidate>
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Username</span>
        <input
          name="username"
          required
          class="mt-1 block w-full rounded-md border-slate-200 bg-slate-50 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300"
        />
      </label>

      <label class="block">
        <span class="text-sm font-medium text-slate-700">Password</span>
        <input
          name="password"
          type="password"
          required
          class="mt-1 block w-full rounded-md border-slate-200 bg-slate-50 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300"
        />
      </label>

      <div class="flex items-center justify-between">
        <label class="inline-flex items-center text-sm">
          <input
            type="checkbox"
            name="remember"
            class="h-4 w-4 rounded border-slate-300 text-indigo-600"
          />
          <span class="ml-2 text-slate-600">Remember me</span>
        </label>
        <a href="#" class="text-sm text-indigo-600 hover:underline"
          >Forgot password?</a
        >
      </div>

      <div>
        <button
          type="submit"
          class="w-full inline-flex justify-center items-center px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700"
        >
          Sign in
        </button>
      </div>
    </form>

    <p class="mt-4 text-center text-sm text-slate-500">
      Don't have an account?
      <a
        href="{{ url_for('auth.register') }}"
        class="text-indigo-600 hover:underline"
        >Register</a
      >
    </p>
  </div>
</div>
{% endblock %}
