<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>My Flask App</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <h1>Users</h1>
    <form action="{{ url_for('main.add_user') }}" method="post">
      <input name="name" placeholder="Name" />
      <button type="submit">Add</button>
    </form>
    <ul>
      {% for u in users %}
      <li>{{ u.name }} ({{ u.created_at }})</li>
      {% endfor %}
    </ul>
  </body>
</html>
